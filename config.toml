baseurl = "https://endormi.io/"
title = "Endormi"
theme = "hugo-coder"
languagecode = "en"
defaultcontentlanguage = "en"
paginate = 20
pygmentsstyle = "bw"
pygmentscodefences = true
pygmentscodefencesguesssyntax = true
enableRobotsTXT = true

[params]
    author = "Erno Salo"
    description = "Personal website for Endormi"
    images = ["static/images/img.png"]
    keywords = "developer,personal,website,portfolio"
    avatarurl = "images/avi.png"
    favicon_32 = "images/avi.png"
    favicon_16 = "images/avi.png"
    hideCredits = true
    colorScheme = "auto"
    hideColorSchemeToggle = false
    rtl = false
    custom_css = ["/css/custom.css"]

[[params.social]]
    name = "Github"
    icon = "fa fa-github fa-2x"
    weight = 1
    url = "https://github.com/endormi/"

[[params.social]]
    name = "Source Code"
    icon = "fa fa-file-code-o fa-2x"
    weight = 2
    url = "https://github.com/endormi/www"

[languages]
    [languages.en]
        languagename = "EN"

            [languages.en.menu]

                [[languages.en.menu.main]]
                    name = "Home"
                    weight = 1
                    url = "/"

                [[languages.en.menu.main]]
                    name = "About"
                    weight = 2
                    url = "/about/"

                [[languages.en.menu.main]]
                    name = "Open Source"
                    weight = 3
                    url = "/open-source/"

                [[languages.en.menu.main]]
                    name = "Thanks"
                    weight = 4
                    url = "/thanks/"

    [languages.fr]
        languagename = "FR"

        [languages.fr.params]
            author = "Erno Salo"
            description = "Le site personnel de Endormi"
            keywords = "développeur,personnel,site,portefeuille"

                [languages.fr.menu]

                    [[languages.fr.menu.main]]
                        name = "Accueil"
                        weight = 1
                        url = "/"

                    [[languages.fr.menu.main]]
                        name = "À propos"
                        weight = 2
                        url = "/à-propos/"

                    [[languages.fr.menu.main]]
                        name = "Open Source"
                        weight = 3
                        url = "/open-source/"

                    [[languages.fr.menu.main]]
                        name = "Merci"
                        weight = 4
                        url = "/merci/"
